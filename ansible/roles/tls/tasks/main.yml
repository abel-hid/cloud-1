---
# Nginx always has certificate files available. On a normal fresh evaluation host
# we create a self-signed pair; on a host with working public DNS we can request a
# trusted Let's Encrypt certificate by setting use_letsencrypt=true.

- name: Create application directory before certificates are generated
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    mode: "0755"
  become: true

- name: Create certificate directory
  ansible.builtin.file:
    path: "{{ app_dir }}/certs"
    state: directory
    mode: "0755"
  become: true

- name: Install OpenSSL for self-signed certificates
  ansible.builtin.apt:
    name: openssl
    state: present
  become: true
  when: not use_letsencrypt

# --------------------------- Self-signed path ---------------------------
# stat + when prevents generating a new key/certificate on every Ansible run.
- name: Check whether self-signed private key exists
  ansible.builtin.stat:
    path: "{{ app_dir }}/certs/privkey.pem"
  register: selfsigned_key
  become: true
  when: not use_letsencrypt

- name: Generate self-signed private key once
  ansible.builtin.command: >-
    openssl genrsa -out {{ app_dir }}/certs/privkey.pem 2048
  become: true
  when: not use_letsencrypt and not selfsigned_key.stat.exists

- name: Protect self-signed private key permissions
  ansible.builtin.file:
    path: "{{ app_dir }}/certs/privkey.pem"
    state: file
    mode: "0600"
  become: true
  when: not use_letsencrypt

- name: Check whether self-signed certificate exists
  ansible.builtin.stat:
    path: "{{ app_dir }}/certs/fullchain.pem"
  register: selfsigned_cert
  become: true
  when: not use_letsencrypt

- name: Generate self-signed certificate once
  ansible.builtin.command: >-
    openssl req -x509 -new -nodes
    -key {{ app_dir }}/certs/privkey.pem
    -out {{ app_dir }}/certs/fullchain.pem
    -days 365
    -subj /CN={{ domain_name }}
  become: true
  when: not use_letsencrypt and not selfsigned_cert.stat.exists

- name: Set self-signed certificate permissions
  ansible.builtin.file:
    path: "{{ app_dir }}/certs/fullchain.pem"
    state: file
    mode: "0644"
  become: true
  when: not use_letsencrypt

# --------------------------- Let's Encrypt path -------------------------
- name: Install Certbot when public TLS is enabled
  ansible.builtin.apt:
    name: certbot
    state: present
  become: true
  when: use_letsencrypt

- name: Check whether Let's Encrypt certificate already exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
  register: letsencrypt_cert
  become: true
  when: use_letsencrypt

# Certbot standalone needs port 80. On a rerun, an existing Nginx container may
# already own that port, so we stop only that container before requesting a cert.
- name: Check whether an old Compose file already exists
  ansible.builtin.stat:
    path: "{{ app_dir }}/docker-compose.yml"
  register: existing_compose
  become: true
  when: use_letsencrypt

- name: Stop existing Nginx before standalone Certbot uses port 80
  ansible.builtin.command: docker compose stop nginx
  args:
    chdir: "{{ app_dir }}"
  register: stopped_nginx
  changed_when: stopped_nginx.rc == 0
  become: true
  when:
    - use_letsencrypt
    - not letsencrypt_cert.stat.exists
    - existing_compose.stat.exists

- name: Obtain Let's Encrypt certificate
  ansible.builtin.command: >-
    certbot certonly --standalone
    -d {{ domain_name }}
    --non-interactive
    --agree-tos
    -m {{ letsencrypt_email }}
  become: true
  when: use_letsencrypt and not letsencrypt_cert.stat.exists

# Nginx reads a stable path under app_dir regardless of which certificate method
# is selected, so the Compose/Nginx templates stay simple.
- name: Copy Let's Encrypt certificate into application directory
  ansible.builtin.copy:
    src: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
    dest: "{{ app_dir }}/certs/fullchain.pem"
    remote_src: true
    mode: "0644"
  become: true
  when: use_letsencrypt

- name: Copy Let's Encrypt private key into application directory
  ansible.builtin.copy:
    src: "/etc/letsencrypt/live/{{ domain_name }}/privkey.pem"
    dest: "{{ app_dir }}/certs/privkey.pem"
    remote_src: true
    mode: "0600"
  become: true
  when: use_letsencrypt
