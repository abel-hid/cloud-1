---
- name: Install ufw
  apt:
    name: ufw
    state: present
  become: true

- name: Set default policy to deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny
  become: true

- name: Set default policy to allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow
  become: true

- name: Allow SSH (port 22)
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
  become: true

- name: Allow HTTP (port 80)
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
  become: true

- name: Allow HTTPS (port 443)
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
  become: true

- name: Enable ufw
  community.general.ufw:
    state: enabled
  become: true
