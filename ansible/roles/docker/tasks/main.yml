---
# Docker is installed from Docker's official Ubuntu repository. These tasks are
# state-based (present/directory/started), so rerunning the role is safe.

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install packages needed for Docker's apt repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
  become: true

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Download Docker's official signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  become: true

# dpkg reports the architecture using Debian names such as "amd64" or "arm64".
# Using that value avoids maintaining our own architecture conversion table.
- name: Read Debian package architecture
  ansible.builtin.command: dpkg --print-architecture
  register: docker_dpkg_arch
  changed_when: false

# Older versions of this project created docker.list. Removing it avoids duplicate
# repository definitions when upgrading an already-provisioned server.
- name: Remove old Docker repository file if present
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  become: true

- name: Configure Docker apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: {{ ansible_distribution_release }}
      Components: stable
      Architectures: {{ docker_dpkg_arch.stdout }}
      Signed-By: /etc/apt/keyrings/docker.asc
  become: true

- name: Install Docker Engine and Docker Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  become: true

# Enabling the service makes Docker start again after a server reboot. Containers
# with a restart policy are then started by Docker automatically.
- name: Ensure Docker service is enabled and running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  become: true
