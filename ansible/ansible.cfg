[defaults]
# Keep the inventory path relative to this directory so commands are short:
#   cd ansible && ansible-playbook site.yml --ask-vault-pass
inventory = ./inventory.ini

# Cloud instances are often replaced. Disabling this prompt keeps the deployment
# non-interactive when a fresh host key is seen.
host_key_checking = False

# Modern Ansible no longer needs retry files; disabling them also keeps the repo clean.
retry_files_enabled = False

# Let Ansible automatically choose the Python interpreter already installed on Ubuntu.
interpreter_python = auto_silent
